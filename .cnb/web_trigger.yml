# 「立即跑一轮」按钮 —— 分支详情页（代码 → main）右侧会出现。
#
# 事件名 web_trigger_daily 必须与 .cnb.yml 里 main: 下的同名键完全一致。
# inputs 的键名就是流水线里的环境变量名，所以这里直接用 .cnb.yml 读的那几个名字。
#
# ⚠️ 只有仓库写权限的人能点这个按钮。
#
# ⚠️ 测速参数（SPEED_* / REFINE_*）是在**延迟阶段**读进来的，然后原样写进
#    dist/candidates.json 的 knobs 字段 —— 真正跑下载测速的是 GitHub 那台机器，
#    它从文件里读参数。所以在这里加一个输入，等于改 GitHub 侧的测速行为。

branch:
  - buttons:
      - name: 立即跑一轮
        description: >-
          CNB 采集 + 延迟测速 → GitHub 经节点测下载速度 → CNB 收尾出配置 →
          提交回 CNB 并复制一份到 GitHub。约 20~40 分钟。
        event: web_trigger_daily
        isDefault: true
        inputs:
          MAX_NODES:
            name: 最终保留节点数
            type: input
            default: "80"
          COUNTRY_SHARE:
            name: 单国最多占比（0 = 不限制）
            type: input
            default: "0.2"
          REFINE_TOP:
            name: 复测最快的多少个（0 = 不复测）
            type: input
            default: "300"
          REFINE_BYTES:
            name: 复测每节点下载字节数
            type: input
            default: "24000000"
          SPEED_WORKERS:
            name: 初筛并发
            type: input
            default: "32"
          SPEED_BYTES:
            name: 初筛每节点下载字节数
            type: input
            default: "6000000"
          SPEED_MAX:
            name: 延迟后最多留多少个进测速（0 = 全测）
            type: input
            default: "0"
          DELAY_TIMEOUT:
            name: 延迟测速超时（毫秒）
            type: input
            default: "5000"
