name: 每日节点聚合（AtomGit · 中国大陆视角）

# 为什么要在 AtomGit 跑：GitHub 托管 runner 在美东，测出来的是美东视角；
# 这里的 runner 在国内，测速结果才对应「国内用户 → 节点」的真实速度。
#
# 但 AtomGit 没有任何 raw 文本端点（实测 12 种形式全返回前端 SPA），
# 所以订阅地址只能在 GitHub —— 本流水线最后一步把 dist/ 用 Contents API 推回去。
#
# 前提：
#   1. 仓库设置里加一个 Secret：GH_TOKEN = 一个有 repo 权限的 GitHub 令牌
#   2. 仓库设置里加一个 Variable：GITHUB_REPO = <用户名>/<仓库名>
#   两者缺任一，流水线仍会跑完并产出 dist/，只是不会推回 GitHub（日志会写明）。
#
# 北京时间 02:00 == UTC 18:00（前一天）
on:
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch:
    inputs:
      max_nodes:
        description: '最终最多保留多少个节点'
        required: false
        default: '80'
      speed_workers:
        description: '下载测速初筛并发'
        required: false
        default: '32'
      speed_max:
        description: '测速前上限（0=不预采样，全部测速）'
        required: false
        default: '0'
      speed_bytes:
        description: '每个节点下载多少字节用于测速（越小越快，但快节点会被分母下限截顶）'
        required: false
        default: '6000000'
      apac_check_top:
        description: '经亚太节点当跳板复测最快的多少个（0=不做交叉验证）'
        required: false
        default: '120'

concurrency:
  max: 1
  exceed-action: QUEUE
  enable: true

jobs:
  build:
    name: 采集·测速·推回GitHub
    # default == [ubuntu-latest, x64, small]（2核8G）。测速是网络瓶颈不是 CPU，
    # 想加快可以改成 [ubuntu-latest, x64, medium]。
    runs-on: default
    timeout-minutes: 120

    steps:
      - name: 检出仓库
        uses: checkout

      - name: 记录测速机位置（决定测速视角）
        run: |
          set -e
          IP=$(curl -s --max-time 10 https://api.ipify.org || echo "")
          echo "runner egress ip: $IP"
          mkdir -p dist
          if [ -n "$IP" ]; then
            GEO=$(curl -s --max-time 10 "http://ip-api.com/json/$IP?fields=status,country,countryCode,regionName,city,isp" || echo "{}")
            echo "runner geo: $GEO"
            echo "$GEO" > dist/runner-geo.json
          else
            echo "::warning::拿不到 runner 出口 IP，无法确认测速视角"
            echo '{"status":"unknown"}' > dist/runner-geo.json
          fi

      - name: 安装依赖
        run: |
          python3 -V
          python3 -m pip install --upgrade pip -q || true
          python3 -m pip install -r requirements.txt -q

      - name: 单元测试（解析器 / 二分定位 / 测速算式 / 亚太复测 / 分层取样 / 源站适配器）
        run: |
          python3 tests/test_parsers.py
          python3 tests/test_bisect.py
          python3 tests/test_speed_math.py
          python3 tests/test_apac.py
          python3 tests/test_selection.py
          python3 tests/test_sources.py

      - name: 采集 · 测速 · 生成配置
        env:
          MAX_NODES: ${{ inputs.max_nodes || '80' }}
          SPEED_WORKERS: ${{ inputs.speed_workers || '32' }}
          SPEED_MAX: ${{ inputs.speed_max || '0' }}
          SPEED_BYTES: ${{ inputs.speed_bytes || '6000000' }}
          APAC_CHECK_TOP: ${{ inputs.apac_check_top || '120' }}
        run: |
          python3 main.py \
            --out dist \
            --work work \
            --max-nodes "$MAX_NODES" \
            --speed-workers "$SPEED_WORKERS" \
            --speed-max "$SPEED_MAX" \
            --speed-bytes "$SPEED_BYTES" \
            --apac-check-top "$APAC_CHECK_TOP"

      - name: 校验产物
        run: |
          test -s dist/clash.yaml || { echo "::error::dist/clash.yaml 未生成"; exit 1; }
          python3 - <<'PY'
          import re, yaml, pathlib

          doc = yaml.safe_load(pathlib.Path("dist/clash.yaml").read_text(encoding="utf-8"))
          proxies = doc.get("proxies") or []
          assert proxies, "配置里没有节点"

          names = [p["name"] for p in proxies]
          assert len(names) == len(set(names)), "节点名有重复，Clash 会拒绝加载"

          pattern = re.compile(r"^.+-(\d{2,})-(\d+\.\d)MB/S$")
          bad = [n for n in names if not pattern.match(n)]
          assert not bad, f"{len(bad)} 个节点名不符合「国家-序号-速度MB/S」格式: {bad[:5]}"

          zero = [n for n in names if pattern.match(n).group(2) == "0.0"]
          assert not zero, f"{len(zero)} 个节点速度是 0.0MB/S: {zero[:5]}"

          for p in proxies:
              assert p.get("server") and p.get("port"), f"节点缺字段: {p}"

          groups = {g["name"]: g for g in doc["proxy-groups"]}
          assert "节点选择" in groups and "自动选择" in groups

          speeds = sorted((float(pattern.match(n).group(2)) for n in names), reverse=True)
          print(f"校验通过：{len(proxies)} 个节点，最快 {speeds[0]} MB/S")
          PY

      - name: 推回 GitHub（订阅地址在那边）
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          GITHUB_REPO: ${{ vars.GITHUB_REPO }}
        run: |
          python3 scripts/push_to_github.py dist
