# CNB 流水线（cnb.cool）—— 主体在这里跑，**下载测速借 GitHub 的机器**。
#
# 为什么这么分工：
#   - **延迟测速必须在国内**：判据是「国内能不能连上这个节点」，换到境外测就是
#     另一个问题。CNB runner（广州腾讯云）正好合适。
#   - **下载测速必须换机器**：CNB runner 的出口只有 3~4 MB/s（实测，见 README），
#     节点再快也读成 3~4。GitHub runner 的出口宽得多，读数才不会被测速机本身压住。
#     代价：速度变成「GitHub runner → 节点」。两段的位置都会写进产物头部。
#
# 一轮的走向：
#   采集 → 延迟测速（CNB）→ dist/candidates.json
#        → 提交到本仓库（公开可读）
#        → **CNB 用令牌 POST `workflow_dispatch` 叫醒 GitHub**（scripts/gh_dispatch.sh，秒级）
#        → GitHub 那边只跑一轮：经节点测速 → 把 dist/speed.json 提交回它自己的仓库
#        → CNB 轮询 GitHub 的公开 raw 取回（run_id 对得上才算）
#        → 国家判定 / 去重 / 重命名（CNB）→ 提交回 CNB
#        → GitHub 侧等 report.json 的 run_id 对上，再把产物复制一份回去
#
# ⚠️ **令牌不写在本文件里，也不写进这个仓库**。这个仓库是**公开**的：写进去等于把
#    写权限发给所有人，而且 GitHub 的密钥扫描会把公开仓库里出现的 `ghp_` 令牌
#    **自动吊销** —— 过几小时就坏。正确做法是 CNB 的「密钥仓库」（仓库类型选
#    `密钥仓库`，只能网页编辑、不能 clone），下面每个 job 的 `imports:` 把它里面的
#    键注入成环境变量。**没有令牌时 `gh_dispatch.sh` 只警告不失败**，退回 GitHub 自己
#    的 cron 兜底（实测 117~148 分钟才触发一次，慢但能通）。
#
# ⚠️ 在此之前用过两种「零密钥」的形状，都不要再回去：
#    1. 「cron 每 10 分钟看一眼」—— 公开仓库的 schedule 实测两小时才一次，等于不看；
#    2. 「一个 job 常驻 5.5 小时轮询」—— 能work，但在 Actions 页面上就是一行
#       `in_progress` 挂着，看起来像卡死，已经被误取消过一次（run 40155272778）。
#
# 三个入口：
#   1. web_trigger_daily —— 分支详情页的「立即跑一轮」按钮，参数可填
#                           （按钮本身配置在 .cnb/web_trigger.yml）
#   2. crontab 0 2       —— 每天北京时间 02:00 自动跑。
#                           ⚠️ CNB 的 crontab **固定按 Asia/Shanghai 解释**，写 0 2 就是凌晨 2 点。
#   3. push              —— **只跑环境自检，不测速**（1 分钟内），
#                           结果写到 dist/probe.json 提交回来。见 scripts/probe_env.py。
#
# ⚠️ 容器时区与 crontab 时区是两件事：crontab 由平台按 Asia/Shanghai 求值，
#    容器本身仍是 UTC，所以脚本里写日期必须显式 `TZ=Asia/Shanghai`。
#
# ⚠️ 阶段列表用 YAML 锚点（&daily_stages / *daily_stages）只写一份。CNB 拿到的是
#    标准 YAML，锚点在平台看到之前就已经展开。改完务必本地验一遍：
#      python -c "import yaml;d=yaml.safe_load(open('.cnb.yml'));print(list(d['main']))"
#
# ⚠️ 这条流水线**不需要任何 GitHub 凭据**。要改 GitHub 那一侧的行为，
#    去改 .github/workflows/speedtest.yml（它用的是 GitHub 自带的 GITHUB_TOKEN）。

main:
  # ---------- 入口 1：手动触发（按钮见 .cnb/web_trigger.yml）----------
  web_trigger_daily:
    - name: daily-nodes-manual
      docker:
        image: python:3.11
      # ⚠️ 取消下面注释之前，**必须先在 CNB 建好密钥仓库**（类型选「密钥仓库」）：
      #      https://cnb.cool/new/repos → 类型「密钥仓库」→ 名字 key（本仓库用的是 StriveGlory/key）
      #      网页里建 envs.yml，内容（**allow_* 不能省**，默认判据是「触发者是不是
      #      密钥仓库的成员」，而定时任务的身份是「最后改 crontab 的那个人」，
      #      他不是密钥仓库成员 ⇒ 必然不过 ⇒ imports 静默注入空值）：
      #          allow_slugs: "StriveGlory/clash-daily"     # slug，不是 URL
      #          allow_branches: main
      #          allow_events: [crontab, push, "web_trigger*"]
      #          GH_DISPATCH_TOKEN: ghp_xxx
      #    建好之前不要取消注释：imports 解析不到会让**整条流水线起不来**。
      imports:
        - https://cnb.cool/StriveGlory/key/-/blob/main/envs.yml
      stages: &daily_stages
        - name: 安装依赖
          script: |
            set -e
            python -m pip install --upgrade pip
            pip install -r requirements.txt

        - name: 单元测试
          script: |
            set -e
            for f in tests/test_*.py; do
              echo "--- $f"
              python "$f"
            done

        - name: 记录测速位置（延迟段）
          script: |
            # 失败不影响主流程：拿不到就只是产物头部少一行「测速位置」
            # ⚠️ 先删掉仓库里那份 —— 它是上一次运行的存档，不删的话
            #    「拿不到 IP」会静默沿用旧值，日志里就会显示一个错的测速位置
            #    （实测：CNB 上跑出了「美国·Boydton」，那是 GitHub runner 的旧数据）。
            rm -f dist/runner-geo.json
            IP=$(curl -s --max-time 10 https://api.ipify.org || echo "")
            if [ -n "$IP" ]; then
              GEO=$(curl -s --max-time 10 \
                "http://ip-api.com/json/${IP}?fields=status,country,countryCode,regionName,city,isp" \
                || echo "{}")
              echo "runner egress: $IP  $GEO"
              mkdir -p dist
              echo "$GEO" > dist/runner-geo.json
            else
              echo "拿不到 runner 出口 IP，本轮不写测速位置"
            fi

        - name: 采集 · 延迟测速
          script: |
            # 只跑 1~4 步：采集 → 去重 → TCP 预筛 → 延迟测速（HTTPS 探测）。
            # 产出 dist/candidates.json，里面是「过了 HTTPS 延迟」的候选。
            # ⚠️ 下面那些 --speed-*/--refine-* 在这一步**不测速**，只是原样写进
            #    candidates.json 的 knobs 字段 —— 真正用它们的是 GitHub 那台机器。
            set -e
            python main.py --stage delay \
              --out dist \
              --work work \
              --speed-max "${SPEED_MAX:-0}" \
              --delay-timeout "${DELAY_TIMEOUT:-5000}" \
              --speed-bytes "${SPEED_BYTES:-6000000}" \
              --speed-workers "${SPEED_WORKERS:-32}" \
              --speed-timeout "${SPEED_TIMEOUT:-10}" \
              --refine-top "${REFINE_TOP:-300}" \
              --refine-workers "${REFINE_WORKERS:-16}" \
              --refine-bytes "${REFINE_BYTES:-24000000}" \
              --ip-timeout "${IP_TIMEOUT:-6}"

        - name: 发布候选
          script: |
            # 先把候选提交上去 —— GitHub 那边是**自己来取**这个公开文件的，
            # 不提交它就永远看不到新一轮。
            # ⚠️ CI_FORCE=1：这一步紧跟在上一轮的产物提交之后，按守卫的判据会被
            #    当成产物提交跳过，于是候选永远发不出去。作者改成 ci@local，
            #    最后那次真正的产物提交就不会再被守卫拦住。
            set -e
            RUN_ID=$(python -c "import json;print(json.load(open('dist/candidates.json'))['run_id'])")
            echo "本轮 run_id=$RUN_ID"
            CI_FORCE=1 CI_AUTHOR_NAME=clash-daily-ci CI_AUTHOR_EMAIL=ci@local \
              bash scripts/ci_commit.sh "chore(handoff): 发布候选 ${RUN_ID}"

        - name: 叫醒 GitHub 测速
          script: |
            # 主路径：拿密钥仓库注入的令牌直接 POST `workflow_dispatch`，秒级开始。
            # 没配令牌时只警告不失败 —— 退回 GitHub 自己的 cron 兜底。
            set -e
            bash scripts/gh_dispatch.sh

        - name: 等 GitHub 测速
          script: |
            # 这里只轮询 GitHub 的公开 raw，等 run_id 对上的 speed.json。
            # 正常情况下上一步已经把它叫醒了，30 秒内就有结果；等不到时脚本会去读
            # GitHub Actions 的公开状态，说清是「没人叫它」还是「叫了但跳过了」。
            set -e
            bash scripts/wait_speed.sh dist/candidates.json

        - name: 合并 · 生成配置
          script: |
            # 只跑第 6 步：排名、剔掉 0 速、同出口去重、国家判定、分层取样、重命名。
            set -e
            python main.py --stage finish \
              --out dist \
              --speed-in dist/speed.json \
              --max-nodes "${MAX_NODES:-80}" \
              --country-share "${COUNTRY_SHARE:-0.2}" \
              --top-per-country "${TOP_PER_COUNTRY:-0}"

        - name: 校验产物
          script: |
            set -e
            test -s dist/clash.yaml || { echo "dist/clash.yaml 未生成"; exit 1; }
            python scripts/verify_dist.py --path dist/clash.yaml

        - name: 提交回仓库
          script: |
            # 复制一份到 GitHub 由 GitHub 侧的工作流自己做（它等 report.json 的
            # run_id 对上后把产物取回去）—— CNB 这边没有任何 GitHub 凭据。
            bash scripts/ci_commit.sh \
              "chore(nodes): 更新 $(TZ=Asia/Shanghai date +'%Y-%m-%d %H:%M') 北京时间"

  # ---------- 入口 2：每天北京时间 02:00 ----------
  "crontab: 0 2 * * *":
    - name: daily-nodes
      docker:
        image: python:3.11
      # 必须和上面那个入口**一致**：这条是每天 02:00 的正式跑。
      # 少了它，定时那轮会正常发布候选、然后在「叫醒 GitHub 测速」处只打一句
      # 「⚠️ 没有 GH_DISPATCH_TOKEN」就退回去靠 cron 兜底，接着在「等 GitHub 测速」
      # 15 分钟后放弃 —— 表现是「每天自动跑都不出产物」，而手动点按钮却好好的。
      imports:
        - https://cnb.cool/StriveGlory/key/-/blob/main/envs.yml
      stages: *daily_stages

  # ---------- 入口 3：push 只跑自检，不测速 ----------
  # 每次推代码都会跑一遍（约 1.5 分钟）。它的产物 dist/probe.json 是「流水线红了
  # 但看不到日志」时唯一能读到的证据，所以不要删。
  #
  # ⚠️ **必须有「安装依赖」这一步。** 单元测试要 import clashhunter.sources →
  #    `yaml`，而 `python:3.11` 镜像里没有 PyYAML。漏了它，测试在第一行就
  #    ModuleNotFoundError，于是「提交回仓库」不执行、dist/probe.json 停在旧时间戳，
  #    而外部看到的只是「推了代码但什么都没变」—— 2026-10-25 就这么踩过一次，
  #    判断依据只有「10 分钟过去 probe.json 还是昨天的」。
  push:
    - name: env-probe
      docker:
        image: python:3.11
      stages:
        - name: 安装依赖
          script: |
            set -e
            python -m pip install --upgrade pip
            pip install -r requirements.txt

        # ⚠️ 单元测试放这里，不只是为了「早发现」：正式那轮的第二个阶段就是
        #    单元测试，它一红整轮就停 —— 而那时已经等到凌晨 2 点了，日志还看不到。
        #    放在 push 里，改完代码当场就知道。耗时约 40 秒。
        - name: 单元测试
          script: |
            set -e
            for f in tests/test_*.py; do
              echo "--- $f"
              python "$f"
            done

        - name: 环境自检
          script: |
            set -e
            python scripts/probe_env.py --out dist/probe.json

        - name: 提交回仓库
          script: |
            bash scripts/ci_commit.sh \
              "chore(probe): 环境自检 $(TZ=Asia/Shanghai date +'%Y-%m-%d %H:%M')"
