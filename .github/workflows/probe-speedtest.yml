name: 探测 speedtest 服务器可达性

# 手动触发的一次性探针，不参与每日构建。
# 目的：验证 CI runner 能不能访问 speedtest.net 的测速服务器（8080 端口），
# 以及从 runner 测它们能拿到多少速度。这决定「用真实测速站判断节点」这条路走不走得通。
#
# 为什么不能在本机测：本机（国内）实测中国电信 4 个服务器全部超时，
# 但 runner 在美西、路径完全不同，本机结论不能外推。

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 记录 runner 位置
        run: |
          echo "=== runner 出网地址 ==="
          curl -s --max-time 15 https://api.ipify.org || true
          echo
          echo "=== runner 归属地 ==="
          curl -s --max-time 15 "http://ip-api.com/json/?fields=status,country,countryCode,regionName,city,isp" || true
          echo

      - name: 探测 speedtest 服务器
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/probe_speedtest.py

      - name: 保存结果
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: speedtest-probe
          path: speedtest-probe.json
          if-no-files-found: warn
