name: 每日节点聚合

# 北京时间 02:00 == UTC 18:00（前一天）。
# 注意：GitHub 的定时任务在高峰期可能延迟几分钟到几十分钟，这属正常现象。
on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:
    inputs:
      max_nodes:
        description: "最终最多保留多少个节点"
        required: false
        default: "300"
      delay_timeout:
        description: "单节点测速超时（毫秒）"
        required: false
        default: "5000"
      skip_exit_ip:
        description: "跳过出口 IP 探测（更快，但国家判定精度下降）"
        type: boolean
        required: false
        default: false

# 提交 dist/ 需要写权限；用仓库自带的 GITHUB_TOKEN 就够，不需要额外 PAT。
permissions:
  contents: write

concurrency:
  group: daily-nodes
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 采集 · 测速 · 生成订阅
        env:
          MAX_NODES: ${{ inputs.max_nodes || '300' }}
          DELAY_TIMEOUT: ${{ inputs.delay_timeout || '5000' }}
        run: |
          EXTRA=""
          if [ "${{ inputs.skip_exit_ip }}" = "true" ]; then
            EXTRA="--no-exit-ip"
          fi
          python main.py \
            --out dist \
            --work work \
            --max-nodes "$MAX_NODES" \
            --delay-timeout "$DELAY_TIMEOUT" \
            $EXTRA

      - name: 校验产物
        run: |
          test -s dist/clash.yaml || { echo "::error::dist/clash.yaml 未生成"; exit 1; }
          python - <<'PY'
          import yaml, pathlib
          doc = yaml.safe_load(pathlib.Path("dist/clash.yaml").read_text(encoding="utf-8"))
          proxies = doc.get("proxies") or []
          assert proxies, "订阅里没有节点"
          names = [p["name"] for p in proxies]
          assert len(names) == len(set(names)), "节点名有重复，Clash 会拒绝加载"
          for p in proxies:
              assert p.get("server") and p.get("port"), f"节点缺字段: {p}"
          print(f"校验通过：{len(proxies)} 个节点，{len(set(names))} 个唯一名称")
          PY

      - name: 保存产物（即使推送失败也能下载）
        uses: actions/upload-artifact@v4
        with:
          name: clash-subscription-${{ github.run_number }}
          path: dist/
          retention-days: 14

      - name: 提交回仓库
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist
          if git diff --cached --quiet; then
            echo "内容无变化，跳过提交"
          else
            git commit -m "chore(nodes): 更新 $(TZ=Asia/Shanghai date +'%Y-%m-%d %H:%M') 北京时间 [skip ci]"
            git push
          fi
