name: 每日节点聚合

# 北京时间 02:00 == UTC 18:00（前一天）。
on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:
    inputs:
      max_nodes:
        description: "最终最多保留多少个节点"
        required: false
        default: "80"
      speed_max:
        description: "测速前最多保留多少个节点（0=不预采样，延迟可用的全部测速）"
        required: false
        default: "0"
      speed_workers:
        description: "下载测速初筛并发"
        required: false
        default: "32"
      refine_top:
        description: "对初筛最快的多少个做低并发复测（0=不复测）"
        required: false
        default: "300"
      refine_workers:
        description: "复测并发"
        required: false
        default: "16"
      apac_check_top:
        description: "经亚太节点当跳板复测最快的多少个（0=不做交叉验证）"
        required: false
        default: "120"
      apac_check_workers:
        description: "亚太复测并发（跳板带宽共享，别调高）"
        required: false
        default: "4"
      speed_bytes:
        description: "每个节点下载多少字节用于测速（越小越快，但快节点会被分母下限截顶）"
        required: false
        default: "6000000"
      delay_timeout:
        description: "单节点延迟测速超时（毫秒）"
        required: false
        default: "5000"

permissions:
  contents: write

concurrency:
  group: daily-nodes
  cancel-in-progress: false

jobs:
  build:
    # ⚠️ 测速视角取决于 runner 所在地。
    #   - 仓库变量 RUNNER_LABEL 未设置 → ubuntu-latest（GitHub 托管，通常在美西）
    #   - 想「从中国大陆附近测速」→ 在亚太机器上装 self-hosted runner，
    #     并把仓库变量 RUNNER_LABEL 设为该 runner 的标签（如 asia）
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 120

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 记录测速机位置（决定测速视角）
        run: |
          set -e
          echo "runner label: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}"
          IP=$(curl -s --max-time 10 https://api.ipify.org || echo "")
          echo "runner egress ip: $IP"
          if [ -n "$IP" ]; then
            GEO=$(curl -s --max-time 10 "http://ip-api.com/json/$IP?fields=status,country,countryCode,regionName,city,isp" || echo "{}")
            echo "runner geo: $GEO"
            echo "$GEO" > runner-geo.json
            mkdir -p dist
            cp runner-geo.json dist/runner-geo.json
          else
            echo "::warning::拿不到 runner 出口 IP，无法确认测速视角"
          fi

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 单元测试（解析器 / 二分定位 / 测速算式 / 亚太复测 / 分层取样 / 源站适配器）
        run: |
          python tests/test_parsers.py
          python tests/test_bisect.py
          python tests/test_speed_math.py
          python tests/test_apac.py
          python tests/test_selection.py
          python tests/test_sources.py

      - name: 采集 · 测速 · 生成配置
        env:
          MAX_NODES: ${{ inputs.max_nodes || '80' }}
          SPEED_MAX: ${{ inputs.speed_max || '0' }}
          SPEED_WORKERS: ${{ inputs.speed_workers || '32' }}
          REFINE_TOP: ${{ inputs.refine_top || '300' }}
          REFINE_WORKERS: ${{ inputs.refine_workers || '16' }}
          APAC_CHECK_TOP: ${{ inputs.apac_check_top || '120' }}
          APAC_CHECK_WORKERS: ${{ inputs.apac_check_workers || '4' }}
          SPEED_BYTES: ${{ inputs.speed_bytes || '6000000' }}
          DELAY_TIMEOUT: ${{ inputs.delay_timeout || '5000' }}
          # 有个源站（freeclashverge）要读 GitHub trees API 才能定位最新日期的文件，
          # 匿名 60 次/小时不够用，带上 token 提到 5000 次/小时。
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python main.py \
            --out dist \
            --work work \
            --max-nodes "$MAX_NODES" \
            --speed-max "$SPEED_MAX" \
            --speed-workers "$SPEED_WORKERS" \
            --refine-top "$REFINE_TOP" \
            --refine-workers "$REFINE_WORKERS" \
            --apac-check-top "$APAC_CHECK_TOP" \
            --apac-check-workers "$APAC_CHECK_WORKERS" \
            --speed-bytes "$SPEED_BYTES" \
            --delay-timeout "$DELAY_TIMEOUT"

      - name: 校验产物
        run: |
          test -s dist/clash.yaml || { echo "::error::dist/clash.yaml 未生成"; exit 1; }
          python - <<'PY'
          import re, yaml, pathlib

          doc = yaml.safe_load(pathlib.Path("dist/clash.yaml").read_text(encoding="utf-8"))
          proxies = doc.get("proxies") or []
          assert proxies, "配置里没有节点"

          names = [p["name"] for p in proxies]
          assert len(names) == len(set(names)), "节点名有重复，Clash 会拒绝加载"

          pattern = re.compile(r"^.+-(\d{2,})-(\d+\.\d)MB/S$")
          bad = [n for n in names if not pattern.match(n)]
          assert not bad, f"{len(bad)} 个节点名不符合「国家-序号-速度MB/S」格式: {bad[:5]}"

          for p in proxies:
              assert p.get("server") and p.get("port"), f"节点缺字段: {p}"

          groups = {g["name"]: g for g in doc["proxy-groups"]}
          assert "节点选择" in groups and "自动选择" in groups
          assert set(names) <= set(groups["自动选择"]["proxies"])

          speeds = sorted((float(pattern.match(n).group(2)) for n in names), reverse=True)
          print(f"校验通过：{len(proxies)} 个节点，最快 {speeds[0]} MB/S")
          PY

      - name: 保存产物
        uses: actions/upload-artifact@v4
        with:
          name: clash-subscription-${{ github.run_number }}
          path: dist/
          retention-days: 14

      - name: 提交回仓库
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist
          if git diff --cached --quiet; then
            echo "内容无变化，跳过提交"
          else
            git commit -m "chore(nodes): 更新 $(TZ=Asia/Shanghai date +'%Y-%m-%d %H:%M') 北京时间 [skip ci]"
            git push
          fi
