# 下载测速 —— 跑在 GitHub runner 上，结果提交回本仓库；CNB 那边轮询取走。
#
# 为什么测速要单独放到这里：CNB runner 的出口只有 3~4 MB/s，节点再快也读成 3~4；
# GitHub runner 的出口宽得多，读数才不会被测速机本身压住。
# 代价是速度变成「GitHub runner → 节点」，所以 CNB 侧会把两个位置都写进产物头部。
#
# **触发方式：CNB 主动叫醒（`workflow_dispatch`），不是靠 cron。**
#   CNB 拿到令牌后直接 POST dispatches，秒级开始；本工作流只跑一轮，跑完就退出。
#
# ⚠️ 曾经是「cron 每 10 分钟看一眼，发现新的 run_id 就测」—— 那是错的：
#    公开仓库的 `schedule` 实测每 **117~148 分钟**才触发一次（2026-10-25，6 次全量
#    对照），于是 CNB 干等了 40 分钟，GitHub 一次都没被叫醒。
#    中间还试过「常驻 5.5 小时的看守」：能work，但它在 Actions 页面上就是一行
#    `in_progress` 挂着，看起来像卡死，已经被误取消过一次（run 40155272778，
#    活了 15 分 19 秒）。现在 CNB 手里有令牌，这两个形状都不需要了。
#
# `schedule` 保留一个稀疏的兜底：万一 CNB 那边的令牌没配好/触发失败，它还能在两小时内
# 把活干了。正常情况这个 cron 全是空跑 —— gate 发现 run_id 已经测过就直接退出。
#
# 一轮的时序：
#   CNB 跑完延迟测速 → 提交 dist/candidates.json（公开可读）→ POST dispatch
#   → 本工作流：读候选 → 经节点测速 → 提交 dist/speed.json
#   → 等 CNB 收尾（轮询 CNB 的 dist/report.json，run_id 对上）→ 把产物复制一份回来
#
# ⚠️ 判断「有没有新的一轮」只能比 run_id，不能看时间戳：兜底的 cron 大多数时候
#    什么都没变，没有这道门每次都要白测一遍。
name: speedtest
run-name: 测速 · ${{ github.event_name }}

on:
  # CNB 用令牌调这个（scripts/gh_dispatch.sh）。这才是主路径。
  workflow_dispatch:
  schedule:
    # 兜底，不是主路径：CNB 没触发成功时才靠它。实测它两小时才来一次。
    - cron: "*/30 * * * *"

concurrency:
  group: speedtest
  # 不取消正在跑的那一轮：测速中途被杀会留下半截结果
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  speed:
    runs-on: ubuntu-latest
    # 一轮 = 测速约 3 分钟 + 等 CNB 收尾最多 15 分钟。给 30 分钟足够，
    # 而且**这个 job 一定会结束** —— 不再有 5.5 小时那种「看起来卡死」的形状。
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: 看 CNB 上有没有新的一轮
        id: gate
        run: |
          set -e
          # ⚠️ 404 必须当成「今天还没有新的一轮」而不是失败：还没跑过一整轮时
          #    candidates.json 根本不存在，若让 `curl -f` 直接失败，兜底的 cron 就是
          #    一天几十次红灯 —— 之后真出问题也看不见。但**网络失败不能当成 404**，
          #    否则 cnb.cool 从 GitHub 不可达时会永远安静地「跳过」，看着一直是绿的。
          code=$(curl -sS --max-time 30 -o /tmp/candidates.json -w '%{http_code}' \
            "https://cnb.cool/StriveGlory/clash-daily/-/git/raw/main/dist/candidates.json?t=$(date +%s)" \
            || echo 000)
          if [ "$code" = "404" ]; then
            echo "CNB 上还没有 dist/candidates.json（还没跑过一整轮）⇒ 跳过"
            echo "skip=1" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$code" != "200" ]; then
            echo "取候选失败：HTTP $code —— 不是「没有新的一轮」，是取不到"
            exit 1
          fi
          python - <<'EOF'
          import json, os, pathlib
          cand = json.load(open("/tmp/candidates.json", encoding="utf-8"))
          run_id = str(cand.get("run_id") or "")
          done = ""
          p = pathlib.Path("dist/speed.json")
          if p.is_file():
              done = str(json.loads(p.read_text(encoding="utf-8")).get("run_id") or "")
          skip = "1" if (run_id and run_id == done) else "0"
          print(f"候选 run_id={run_id or '(空)'}，已测过={done or '(无)'} ⇒ "
                f"{'跳过' if skip == '1' else '开始测速'}")
          print(f"候选 {len(cand.get('candidates') or [])} 个")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"run_id={run_id}\nskip={skip}\n")
          EOF

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.skip != '1'
        with:
          python-version: "3.11"

      - name: 取 CNB 上的代码
        if: steps.gate.outputs.skip != '1'
        run: |
          set -e
          # 代码从 CNB 取，不从本仓库取 —— 本仓库的 main 只是产物副本，
          # 代码可能落后好几轮。跑旧代码测出来的结果看着一样正常，最难发现。
          git clone --depth 1 https://cnb.cool/StriveGlory/clash-daily.git /tmp/cnb
          git -C /tmp/cnb log -1 --format='CNB HEAD: %h %s'
          pip install -r /tmp/cnb/requirements.txt

      - name: 下载测速（经节点，用 Cloudflare）
        if: steps.gate.outputs.skip != '1'
        run: |
          set -e
          cd /tmp/cnb
          # 并发 / 下载量 / 复测个数**不在这里传**：它们跟着 dist/candidates.json
          # 的 knobs 字段过来（源头是 CNB 按钮上的参数）。在这里再写一份就会
          # 出现「按钮改了但没生效」——两边各说各话。
          #
          # ⚠️ `--in` 必须是**刚才 gate 判过的那份** `/tmp/candidates.json`，
          #    不是 `/tmp/cnb/dist/candidates.json`。clone 里那份随时可能已经变成
          #    下一轮：于是 speed.json 的 run_id 是 Y 而 CNB 在等 X，两边都「成功」、
          #    CNB 一直等到超时，日志里看不出任何异常。
          python main.py --stage speed \
            --in /tmp/candidates.json \
            --speed-out /tmp/speed.json \
            --work /tmp/work
          python - <<'EOF'
          import json
          want = json.load(open("/tmp/candidates.json", encoding="utf-8"))["run_id"]
          got = json.load(open("/tmp/speed.json", encoding="utf-8")).get("run_id")
          print(f"测速结果 run_id={got}，候选 run_id={want}")
          if got != want:
              raise SystemExit("run_id 不一致 —— 提交上去 CNB 也认不出")
          EOF

      - name: 提交测速结果
        if: steps.gate.outputs.skip != '1'
        run: |
          set -e
          cp /tmp/speed.json dist/speed.json
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/speed.json
          git commit -m "chore(speed): $(TZ=Asia/Shanghai date +'%Y-%m-%d %H:%M') 北京时间 run_id=${{ steps.gate.outputs.run_id }}"
          git push

      - name: 等 CNB 收尾，再复制一份产物
        if: steps.gate.outputs.skip != '1'
        run: |
          set -e
          RUN_ID="${{ steps.gate.outputs.run_id }}"
          echo "等 CNB 把这一轮收尾（run_id=$RUN_ID）"
          ok=0
          for i in $(seq 1 60); do
            curl -fsS --max-time 20 -H 'Cache-Control: no-cache' \
              "https://cnb.cool/StriveGlory/clash-daily/-/git/raw/main/dist/report.json?t=$(date +%s)$i" \
              -o /tmp/report.json 2>/dev/null || true
            GOT=$(python - /tmp/report.json <<'EOF'
          import json, sys
          try:
              print(json.load(open(sys.argv[1], encoding="utf-8")).get("run_id") or "")
          except Exception:
              print("")
          EOF
            )
            if [ "$GOT" = "$RUN_ID" ]; then ok=1; break; fi
            sleep 15
          done
          if [ "$ok" != "1" ]; then
            echo "⚠️ 15 分钟内没等到 CNB 收尾 —— 这一轮不复制产物（下一轮会带上）"
            exit 0
          fi
          # CNB 只能读公开 raw，这里逐个取回来再提交到本仓库
          for f in clash.yaml clash.base64.txt report.json report.md candidates.json; do
            curl -fsS --max-time 30 \
              "https://cnb.cool/StriveGlory/clash-daily/-/git/raw/main/dist/$f?t=$(date +%s)" \
              -o "dist/$f"
          done
          git add dist
          if git diff --cached --quiet; then
            echo "产物没有变化，跳过提交"
            exit 0
          fi
          git commit -m "chore(nodes): 复制 $(TZ=Asia/Shanghai date +'%Y-%m-%d %H:%M') 北京时间的一轮产物"
          git push
